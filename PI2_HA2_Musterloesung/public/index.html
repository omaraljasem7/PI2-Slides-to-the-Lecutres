<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="./adderFetch.js"></script>
    <style>
        body {
            padding: 20px;
        }
        #login-name {
            position: absolute;
            top: 28px;
            right: 28px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Adder</h1>
    <div id="login-name"></div>
    <form id="add-form">
        <div class="input-group">
            <span class="input-group-text text-primary">a</span>
            <input type="text" id="a" class="form-control">
            <span class="input-group-text text-primary">b</span>
            <input type="text" id="b" class="form-control">
            <span class="input-group-text text-primary">c</span>
            <input type="text" id="c" class="form-control">
            <button class="btn btn-success btn-lg px-4" type="submit">
                <i class="bi bi-calculator"></i> <strong>=</strong>
            </button>
            <span class="input-group-text" id="result">?</span>
        </div>
    </form>
</div>

<div class="container">
    <form id="user-form">
        <label for="username" class="text-primary">Nutzername</label>
        <input type="text" id="username" class="form-control mb-2">
        <button type="submit" class="btn btn-primary btn-lg px-4">
            <i class="bi bi-box-arrow-in-right"></i> <strong>Login</strong>
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
